code: mandarin
name: Mandarin Chinese

# Speech (Phase 3). stt_model is a faster-whisper model size (downloaded
# and cached by the library itself) - not a HF model id. "base" is fine for
# Mandarin; verified zh_CN-huayan-medium exists in rhasspy/piper-voices.
stt_model: base
whisper_language: zh
tts_engine: piper
tts_voice: zh_CN-huayan-medium

seed_vocab: seed-data/vocab.jsonl
seed_sentences: seed-data/sentences.jsonl
persona_prompts_dir: prompts
