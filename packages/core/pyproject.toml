[project]
name = "lingua-core"
version = "0.1.0"
description = "Langpack loading and conversation orchestration for Lingua"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*"]
