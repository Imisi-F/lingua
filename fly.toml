# Deploy from the REPO ROOT: `fly deploy` (not from apps/api).
# Rename `app` below to whatever `fly apps create` gives you, and set
# `primary_region` to whatever region flyctl suggests as nearest to you.

app = "imzlingua"
primary_region = "lhr"

[build]
  dockerfile = "apps/api/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  # 512mb was fine for the text-only Phase 1/2 backend but OOM-killed the
  # process as soon as torch+transformers loaded the MMS model for Yoruba
  # TTS (observed: ~395MB anon-rss against a 512MB limit, confirmed via
  # `fly logs`). Bumped with headroom since torch's own baseline footprint
  # is the main cost here, not the (small, 36M-param) model itself.
  memory = "2048mb"
  cpu_kind = "shared"
  cpus = 1
